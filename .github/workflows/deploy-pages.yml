name: Deploy to GitHub Pages (fire-code.jcampos.dev)

# The public landing. Content edited online in the admin console is pulled from the public
# content API before the SEO prerender, so the static pages match the live site; a daily
# rebuild picks up edits made since the last push.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Read-only role from sokol-infrastructure web/web-params.yml (trusts this repo).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WEB_BUILD_ROLE_ARN }}
          aws-region: us-east-1

      # Only site/app-url + public-api/* — the landing never sees auth or app API config.
      - name: Load web config from SSM (/sokol/dev/web)
        run: bash scripts/load-env-from-ssm.sh dev - --github-env

      # Published documents overwrite src/content/*.json (never fails the build).
      - name: Pull published content
        run: pnpm content:pull

      # i18n + hard-coded-text checks, typecheck, vite build, SEO prerender, bundle check
      - run: pnpm build

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
